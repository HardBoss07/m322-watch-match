    </g>
  </g>

  <!-- WORDMARK: WatchMatch. -->
  <text x="76" y="47" font-family="'Roboto Flex', 'Inter', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em"><tspan fill="#ffffff">Watch</tspan><tspan fill="#d80b69">Match</tspan><tspan fill="#ffd405">.</tspan></text>
</svg>
